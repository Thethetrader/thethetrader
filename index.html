  <script>
    /* Auto-reload once if a Vite chunk is missing after a new deploy */
    (function() {
      function handleChunkError(msg) {
        if (typeof msg === 'string' && (msg.indexOf('Failed to fetch dynamically imported module') !== -1 || msg.indexOf('Importing a module script failed') !== -1 || msg.indexOf('Unable to preload CSS') !== -1)) {
          if (!sessionStorage.getItem('_cr')) {

          }
        }
      }
      window.addEventListener('error', function(e) { handleChunkError(e.message); });

    <div id="root">
      <!-- Splash screen blanc affiché avant que React monte -->
      <div id="app-splash" style="
        position:fixed;inset:0;
        background:#ffffff;
        display:flex;align-items:center;justify-content:center;
        z-index:9999;
        transition:opacity 0.3s ease;
      ">
        <img src="/faviconsansfond.webp" alt="TPLN" style="width:140px;height:auto;object-fit:contain;" />
      </div>
    </div>
    <script>
      /* Masquer le splash dès que React a monté */
      document.addEventListener('DOMContentLoaded', function() {
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 1) {
            var splash = document.getElementById('app-splash');
            if (splash) {
              splash.style.opacity = '0';
              setTimeout(function() { splash.remove(); }, 300);
            }
            observer.disconnect();
          }
        });
        observer.observe(document.getElementById('root'), { childList: true });
      });
    </script>
